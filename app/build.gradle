plugins {
    id "com.android.application"
}

def diagnosticUrl = System.getenv("CABLE_DIAG_URL") ?: ""
def diagnosticToken = System.getenv("CABLE_DIAG_TOKEN") ?: ""

android {
    namespace "com.pepea.siteview"
    compileSdk 35

    defaultConfig {
        applicationId "com.pepea.siteview"
        minSdk 26
        targetSdk 35
        versionCode 23
        versionName "2.1.0"
    }

    flavorDimensions "navigation"

    productFlavors {
        skynet {
            dimension "navigation"
            buildConfigField "String", "DIAG_URL", '""'
            buildConfigField "String", "DIAG_TOKEN", '""'
            buildConfigField "boolean", "POINTER_ENABLED", "true"
            buildConfigField "String", "UPDATE_TAG_PREFIX", "\"v\""
            buildConfigField "String", "UPDATE_ASSET_NAME", "\"Skynet.apk\""
        }
        cable {
            dimension "navigation"
            applicationId "com.pepea.cable"
            versionCode 11
            versionName "1.2.8"
            buildConfigField "boolean", "POINTER_ENABLED", "true"
            buildConfigField "String", "UPDATE_TAG_PREFIX", "\"cable-v\""
            buildConfigField "String", "UPDATE_ASSET_NAME", "\"Cable.apk\""
            buildConfigField "String", "DIAG_URL", "\"${diagnosticUrl}\""
            buildConfigField "String", "DIAG_TOKEN", "\"${diagnosticToken}\""
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
