plugins {
    id "com.android.application"
}

android {
    namespace "com.pepea.siteview"
    compileSdk 35

    defaultConfig {
        applicationId "com.pepea.siteview"
        minSdk 22
        targetSdk 35
        versionCode 25
        versionName "2.2.1"
    }

    flavorDimensions "navigation"

    productFlavors {
        skynet {
            dimension "navigation"
            buildConfigField "boolean", "POINTER_ENABLED", "true"
            buildConfigField "String", "UPDATE_TAG_PREFIX", "\"v\""
            buildConfigField "String", "UPDATE_ASSET_NAME", "\"Skynet.apk\""
        }
        cable {
            dimension "navigation"
            applicationId "com.pepea.cable"
            versionCode 15
            versionName "1.3.2"
            buildConfigField "boolean", "POINTER_ENABLED", "true"
            buildConfigField "String", "UPDATE_TAG_PREFIX", "\"cable-v\""
            buildConfigField "String", "UPDATE_ASSET_NAME", "\"Cable.apk\""
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            signingConfig.enableV1Signing = true
            signingConfig.enableV2Signing = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
